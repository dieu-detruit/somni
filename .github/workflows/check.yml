name: Verify Somnio
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Tests/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
          brew install xcodegen
      - name: Tests and unsigned companion archive
        run: bash scripts/check.sh
