workflows:
  somnio-check:
    name: Somnio tests and unsigned archive
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.3
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Test and archive
        script: bash scripts/check.sh
    artifacts:
      - /tmp/Somnio-tests.xcresult
      - /tmp/Somnio.xcarchive
  somnio-testflight:
    name: Somnio TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: brain-dump
    environment:
      xcode: 26.3
      vars:
        APPLE_TEAM_ID: XLVLA9AY6A
        APP_BUNDLE_ID: com.takafumi.somni
        WATCH_BUNDLE_ID: com.takafumi.somni.watchkit
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.takafumi.somni*
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Tests
        script: swift test
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
      - name: Archive and export
        script: bash scripts/archive.sh
    artifacts:
      - /tmp/somnio-export/*.ipa
      - /tmp/Somnio.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: [Internal]
